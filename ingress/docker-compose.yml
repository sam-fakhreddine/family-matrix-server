# Optional bundled ingress: Traefik v3 + Cloudflare Tunnel (token-based).
# Skip this entire directory if you already run Traefik — just set
# TRAEFIK_NETWORK in ../.env to your existing network's name.
#
# Reads TUNNEL_TOKEN and CF_DNS_API_TOKEN from ../.env:
#   docker compose --env-file ../.env up -d
name: family-matrix-ingress

services:
  # Filtered docker API gateway. Traefik needs the docker API for service
  # discovery, but a raw docker.sock mount hands any RCE in the proxy
  # root-equivalent control of the host. This proxy allows exactly the
  # read-only endpoints traefik's discovery uses (ping/version/container
  # list/events) and denies everything else — every write method, exec,
  # images, volumes, swarm — by default-deny.
  socket-proxy:
    image: docker.io/wollomatic/socket-proxy:1.12.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "0:0" # must read docker.sock; the allowlist below is the boundary
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=traefik # only the traefik container may even connect
      - -allowHEAD=/_ping
      # containers/json = list, containers/<id>/json = inspect — deliberately
      # NOT containers/.*, which would also allow GET archive/export/logs
      # (file exfiltration from any container via a compromised traefik)
      - -allowGET=(/_ping|/v1\..{1,3}/(version|events.*|containers/json|containers/[a-zA-Z0-9_.-]+/json))
      - -watchdoginterval=600 # exit (and get restarted) if docker.sock vanishes
      - -stoponwatchdog
      - -shutdowngracetime=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  traefik:
    image: docker.io/traefik:v3.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # binds :80/:443 in-container
    depends_on:
      - socket-proxy
    command:
      - --providers.docker=true
      # via the socket proxy — traefik itself never touches docker.sock
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via Cloudflare DNS-01 (works with proxied/tunneled hosts)
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --global.sendanonymoususage=false
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./letsencrypt:/letsencrypt
    networks:
      - ingress
      - docker-api

  # Token-based (remote-managed) tunnel: hostnames are configured in the
  # Cloudflare dashboard, not in a local config file. This intentionally
  # avoids the locally-managed cert.pem/config.yml approach, whose
  # `tunnel route dns` writes records into whichever zone the cert belongs
  # to — a classic wrong-zone trap on multi-domain accounts.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL] # distroless, runs as 65532, outbound-only
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - ingress

networks:
  ingress:
    # The chat stack joins this network; name must match TRAEFIK_NETWORK in ../.env
    name: family-matrix-ingress
  # traefik <-> socket-proxy only. internal = no gateway: nothing on this
  # network can reach out, and no published port can reach into it.
  docker-api:
    internal: true
